version: '3.8'

services:
  backend:
    build: ./backend
    container_name: abstention-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - experiment_data:/app/data
    environment:
      - DATABASE_URL=sqlite:///./data/experiment.db
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build: ./frontend
    container_name: abstention-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  experiment_data:
